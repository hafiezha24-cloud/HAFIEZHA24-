<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAFIEZHA24 — Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#f8fafc)}
.authbox{width:min(430px,100%);background:white;border-radius:22px;padding:28px;box-shadow:0 18px 55px #0001}
.logo{font-size:28px;font-weight:800;color:var(--p)}.sub{color:var(--muted);margin:4px 0 22px}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d8dee9;border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #2563eb18}
.btn{padding:10px 14px;border-radius:10px;background:var(--p);color:white;font-weight:700}.btn.secondary{background:#e8eefc;color:#174ea6}.btn.danger{background:#fee2e2;color:#991b1b}.btn.gray{background:#e5e7eb;color:#111827}
.auth .btn{width:100%;margin-top:10px}.switch{text-align:center;margin-top:15px;font-size:14px;color:var(--muted)}.switch a{color:var(--p);font-weight:700;cursor:pointer}
.msg{margin:10px 0;padding:10px;border-radius:10px;background:#f1f5f9;font-size:14px}.msg.err{background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}
.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;color:var(--p)}.user{font-size:13px;color:var(--muted)}
.layout{display:flex;min-height:calc(100vh - 64px)}.side{width:230px;background:#111827;color:#e5e7eb;padding:14px;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:9px}.nav button.active,.nav button:hover{background:#1f2937;color:white}
.main{padding:20px;width:100%;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.title h1{margin:0;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border-radius:15px;padding:18px;box-shadow:0 3px 14px #0000000a;border:1px solid #e8edf5}.metric{font-size:25px;font-weight:850;margin-top:6px}.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{background:#fff;border:1px solid #e8edf5;border-radius:15px;padding:16px;margin-bottom:15px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}
.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;font-size:12px;border-radius:8px}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:20}.modalbox{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:17px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}
.cartrow{display:grid;grid-template-columns:1fr 80px 100px;gap:8px;align-items:center;margin:8px 0}.total{font-size:21px;font-weight:800;text-align:right;margin:12px 0}
.empty{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:850px){.side{width:68px;padding:8px}.nav button{font-size:0;text-align:center}.nav button:before{font-size:20px}.nav button[data-page="dashboard"]:before{content:"🏠"}.nav button[data-page="products"]:before{content:"📦"}.nav button[data-page="customers"]:before{content:"👥"}.nav button[data-page="sales"]:before{content:"🛒"}.nav button[data-page="cash"]:before{content:"💰"}.nav button[data-page="reports"]:before{content:"📊"}.nav button[data-page="settings"]:before{content:"⚙️"}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:500px){.main{padding:12px}.cards{grid-template-columns:1fr 1fr}.top{padding:0 10px}.user{display:none}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="authbox">
    <div class="logo">HAFIEZHA24</div><div class="sub">Aplikasi toko online • Admin</div>
    <div id="authMsg" class="msg hidden"></div>
    <form id="authForm">
      <div class="field"><label>Email Admin</label><input id="email" type="email" required placeholder="admin@email.com"></div>
      <div class="field"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="Minimal 6 karakter"></div>
      <button class="btn" id="authBtn">Masuk</button>
    </form>
    <div class="switch"><span id="switchText">Belum punya akun?</span> <a id="switchMode">Daftar admin</a></div>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top"><div class="brand">HAFIEZHA24</div><div><span id="who" class="user"></span> <button id="logout" class="btn small gray">Keluar</button></div></header>
<div class="layout">
<aside class="side"><nav class="nav">
<button data-page="dashboard" class="active">Dashboard</button>
<button data-page="products">Produk</button>
<button data-page="customers">Pelanggan</button>
<button data-page="sales">Penjualan</button>
<button data-page="cash">Keuangan</button>
<button data-page="reports">Laporan</button>
<button data-page="settings">Pengaturan</button>
</nav></aside>
<main id="main" class="main"></main>
</div></div>

<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button class="btn small gray" onclick="closeModal()">Tutup</button></div><div id="modalBody"></div></div></div>

<script>
const SUPABASE_URL="https://fbhkusahcnxhtfcenxoz.supabase.co";
const SUPABASE_KEY="sb_publishable_Tg2e33G3VsVXbTUQrq7jbg__FjZhYwK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, products=[], customers=[], sales=[], cash=[], cart=[], authSignup=false, page="dashboard";

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function rup(v){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(v||0)}
function date(v){return new Date(v).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}
function msg(t,err=false){$("authMsg").textContent=t;$("authMsg").className="msg "+(err?"err":"ok")}
function setModal(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}

async function loadAll(){
  const [p,c,s,ca]=await Promise.all([
    sb.from("products").select("*").order("created_at",{ascending:false}),
    sb.from("customers").select("*").order("created_at",{ascending:false}),
    sb.from("sales").select("*").order("created_at",{ascending:false}),
    sb.from("cash_entries").select("*").order("created_at",{ascending:false})
  ]);
  if(p.error||c.error||s.error||ca.error){console.error(p.error,c.error,s.error,ca.error);alert("Gagal memuat data. Periksa koneksi Supabase.");return}
  products=p.data||[];customers=c.data||[];sales=s.data||[];cash=ca.data||[];
}
function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  const fn={dashboard:renderDashboard,products:renderProducts,customers:renderCustomers,sales:renderSales,cash:renderCash,reports:renderReports,settings:renderSettings}[page];
  fn();
}
function renderDashboard(){
  const omzet=sales.reduce((a,b)=>a+Number(b.total),0), masuk=cash.filter(x=>x.type==="masuk").reduce((a,b)=>a+Number(b.amount),0), keluar=cash.filter(x=>x.type==="keluar").reduce((a,b)=>a+Number(b.amount),0);
  $("main").innerHTML=`<div class="title"><h1>Dashboard</h1><button class="btn" onclick="openProduct()">+ Produk</button></div>
  <div class="cards"><div class="card"><div class="muted">Produk</div><div class="metric">${products.length}</div></div><div class="card"><div class="muted">Pelanggan</div><div class="metric">${customers.length}</div></div><div class="card"><div class="muted">Omzet Penjualan</div><div class="metric">${rup(omzet)}</div></div><div class="card"><div class="muted">Saldo Keuangan</div><div class="metric">${rup(masuk-keluar)}</div></div></div>
  <div class="panel" style="margin-top:15px"><h3>Penjualan Terbaru</h3>${sales.length?`<div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Pelanggan</th><th>Total</th></tr>${sales.slice(0,8).map(s=>`<tr><td>${date(s.created_at)}</td><td>${esc(s.customer_name||"-")}</td><td>${rup(s.total)}</td></tr>`).join("")}</table></div>`:`<div class="empty">Belum ada transaksi.</div>`}</div>`;
}
function renderProducts(){
 $("main").innerHTML=`<div class="title"><h1>Produk</h1><button class="btn" onclick="openProduct()">+ Tambah Produk</button></div><div class="panel"><div class="tablewrap"><table class="table"><tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category||"-")}</td><td>${rup(p.price)}</td><td>${p.stock}</td><td><div class="actions"><button class="btn small secondary" onclick="openProduct('${p.id}')">Edit</button><button class="btn small danger" onclick="delProduct('${p.id}')">Hapus</button></div></td></tr>`).join("")||`<tr><td colspan="5"><div class="empty">Belum ada produk.</div></td></tr>`}</table></div></div>`;
}
function openProduct(id){
 const p=products.find(x=>x.id===id)||{};
 setModal(id?"Edit Produk":"Tambah Produk",`<form onsubmit="saveProduct(event,'${id||""}')">
 <div class="field"><label>Nama Produk</label><input id="pn" required value="${esc(p.name)}"></div>
 <div class="field"><label>Kategori</label><input id="pc" value="${esc(p.category)}"></div>
 <div class="field"><label>Harga</label><input id="pp" type="number" min="0" required value="${p.price||0}"></div>
 <div class="field"><label>Stok</label><input id="ps" type="number" min="0" required value="${p.stock??0}"></div>
 <button class="btn">Simpan</button></form>`);
}
async function saveProduct(e,id){e.preventDefault();const data={owner_id:user.id,name:$("pn").value.trim(),category:$("pc").value.trim(),price:Number($("pp").value),stock:Number($("ps").value)};const q=id?sb.from("products").update(data).eq("id",id):sb.from("products").insert(data);const {error}=await q;if(error)return alert(error.message);closeModal();await loadAll();render()}
async function delProduct(id){if(!confirm("Hapus produk ini?"))return;const {error}=await sb.from("products").delete().eq("id",id);if(error)alert(error.message);else{await loadAll();render()}}

function renderCustomers(){
 $("main").innerHTML=`<div class="title"><h1>Pelanggan</h1><button class="btn" onclick="openCustomer()">+ Tambah Pelanggan</button></div><div class="panel"><div class="tablewrap"><table class="table"><tr><th>Nama</th><th>WhatsApp</th><th>Alamat</th><th>Aksi</th></tr>${customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||"-")}</td><td>${esc(c.address||"-")}</td><td><div class="actions"><button class="btn small secondary" onclick="openCustomer('${c.id}')">Edit</button><button class="btn small danger" onclick="delCustomer('${c.id}')">Hapus</button></div></td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">Belum ada pelanggan.</div></td></tr>`}</table></div></div>`;
}
function openCustomer(id){
 const c=customers.find(x=>x.id===id)||{};
 setModal(id?"Edit Pelanggan":"Tambah Pelanggan",`<form onsubmit="saveCustomer(event,'${id||""}')">
 <div class="field"><label>Nama</label><input id="cn" required value="${esc(c.name)}"></div><div class="field"><label>No. WhatsApp</label><input id="cp" value="${esc(c.phone)}"></div><div class="field"><label>Alamat</label><textarea id="ca">${esc(c.address)}</textarea></div><button class="btn">Simpan</button></form>`);
}
async function saveCustomer(e,id){e.preventDefault();const data={owner_id:user.id,name:$("cn").value.trim(),phone:$("cp").value.trim(),address:$("ca").value.trim()};const q=id?sb.from("customers").update(data).eq("id",id):sb.from("customers").insert(data);const {error}=await q;if(error)return alert(error.message);closeModal();await loadAll();render()}
async function delCustomer(id){if(!confirm("Hapus pelanggan ini?"))return;const {error}=await sb.from("customers").delete().eq("id",id);if(error)alert(error.message);else{await loadAll();render()}}

function renderSales(){
 $("main").innerHTML=`<div class="title"><h1>Penjualan</h1><button class="btn" onclick="newSale()">+ Transaksi</button></div><div class="panel"><div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Pelanggan</th><th>Total</th></tr>${sales.map(s=>`<tr><td>${date(s.created_at)}</td><td>${esc(s.customer_name||"-")}</td><td>${rup(s.total)}</td></tr>`).join("")||`<tr><td colspan="3"><div class="empty">Belum ada transaksi.</div></td></tr>`}</table></div></div>`;
}
function newSale(){cart=[];setModal("Transaksi Penjualan",`<div class="field"><label>Pelanggan</label><select id="sc"><option value="">Umum</option>${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
<div class="field"><label>Produk</label><select id="sp">${products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${rup(p.price)} (stok ${p.stock})</option>`).join("")}</select></div>
<div class="field"><label>Jumlah</label><input id="sq" type="number" min="1" value="1"></div><button class="btn secondary" onclick="addCart()">Tambah ke Keranjang</button><div id="cartbox" style="margin-top:14px"></div>`);drawCart()}
function addCart(){const p=products.find(x=>x.id===$("sp").value);if(!p)return;const q=Math.max(1,Number($("sq").value));const existing=cart.find(x=>x.product_id===p.id);if((existing?.qty||0)+q>p.stock)return alert("Stok tidak cukup.");if(existing)existing.qty+=q;else cart.push({product_id:p.id,product_name:p.name,price:Number(p.price),qty:q});drawCart()}
function drawCart(){const total=cart.reduce((a,x)=>a+x.price*x.qty,0);$("cartbox").innerHTML=`${cart.map((x,i)=>`<div class="cartrow"><div>${esc(x.product_name)}<br><span class="muted">${rup(x.price)}</span></div><input type="number" min="1" value="${x.qty}" onchange="cart[${i}].qty=Math.max(1,Number(this.value));drawCart()"><button class="btn small danger" onclick="cart.splice(${i},1);drawCart()">Hapus</button></div>`).join("")||`<div class="empty">Keranjang kosong.</div>`}<div class="total">Total: ${rup(total)}</div><button class="btn" onclick="saveSale()">Simpan Transaksi</button>`}
async function saveSale(){
 if(!cart.length)return alert("Keranjang kosong.");
 const c=customers.find(x=>x.id===$("sc").value), total=cart.reduce((a,x)=>a+x.price*x.qty,0);
 const {data:s,error:e}=await sb.from("sales").insert({owner_id:user.id,customer_id:c?.id||null,customer_name:c?.name||"Umum",total}).select().single();
 if(e)return alert(e.message);
 const items=cart.map(x=>({owner_id:user.id,sale_id:s.id,product_id:x.product_id,product_name:x.product_name,qty:x.qty,price:x.price}));
 const {error:ie}=await sb.from("sale_items").insert(items);if(ie){alert(ie.message);return}
 for(const x of cart){const p=products.find(y=>y.id===x.product_id);await sb.from("products").update({stock:p.stock-x.qty}).eq("id",p.id)}
 closeModal();await loadAll();render();alert("Transaksi berhasil disimpan.");
}

function renderCash(){
 const masuk=cash.filter(x=>x.type==="masuk").reduce((a,b)=>a+Number(b.amount),0),keluar=cash.filter(x=>x.type==="keluar").reduce((a,b)=>a+Number(b.amount),0);
 $("main").innerHTML=`<div class="title"><h1>Keuangan</h1><button class="btn" onclick="openCash()">+ Catatan</button></div><div class="cards"><div class="card"><div class="muted">Kas Masuk</div><div class="metric">${rup(masuk)}</div></div><div class="card"><div class="muted">Kas Keluar</div><div class="metric">${rup(keluar)}</div></div><div class="card"><div class="muted">Saldo</div><div class="metric">${rup(masuk-keluar)}</div></div></div><div class="panel" style="margin-top:15px"><div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Keterangan</th><th>Jenis</th><th>Jumlah</th><th>Aksi</th></tr>${cash.map(x=>`<tr><td>${date(x.created_at)}</td><td>${esc(x.description)}</td><td>${x.type}</td><td>${rup(x.amount)}</td><td><button class="btn small danger" onclick="delCash('${x.id}')">Hapus</button></td></tr>`).join("")||`<tr><td colspan="5"><div class="empty">Belum ada catatan.</div></td></tr>`}</table></div></div>`;
}
function openCash(){setModal("Catatan Keuangan",`<form onsubmit="saveCash(event)"><div class="field"><label>Keterangan</label><input id="cd" required placeholder="Contoh: beli bahan baku"></div><div class="field"><label>Jenis</label><select id="ct"><option value="masuk">Masuk</option><option value="keluar">Keluar</option></select></div><div class="field"><label>Jumlah</label><input id="cv" type="number" min="0" required></div><button class="btn">Simpan</button></form>`)}
async function saveCash(e){e.preventDefault();const {error}=await sb.from("cash_entries").insert({owner_id:user.id,description:$("cd").value.trim(),type:$("ct").value,amount:Number($("cv").value)});if(error)alert(error.message);else{closeModal();await loadAll();render()}}
async function delCash(id){if(!confirm("Hapus catatan?"))return;const {error}=await sb.from("cash_entries").delete().eq("id",id);if(error)alert(error.message);else{await loadAll();render()}}

function renderReports(){
 const omzet=sales.reduce((a,b)=>a+Number(b.total),0),masuk=cash.filter(x=>x.type==="masuk").reduce((a,b)=>a+Number(b.amount),0),keluar=cash.filter(x=>x.type==="keluar").reduce((a,b)=>a+Number(b.amount),0);
 $("main").innerHTML=`<div class="title"><h1>Laporan</h1><button class="btn secondary" onclick="window.print()">Cetak</button></div><div class="cards"><div class="card"><div class="muted">Total Penjualan</div><div class="metric">${rup(omzet)}</div></div><div class="card"><div class="muted">Kas Masuk</div><div class="metric">${rup(masuk)}</div></div><div class="card"><div class="muted">Kas Keluar</div><div class="metric">${rup(keluar)}</div></div><div class="card"><div class="muted">Saldo</div><div class="metric">${rup(masuk-keluar)}</div></div></div><div class="panel" style="margin-top:15px"><h3>Ringkasan Stok</h3><div class="tablewrap"><table class="table"><tr><th>Produk</th><th>Stok</th><th>Nilai Stok</th></tr>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${rup(Number(p.price)*p.stock)}</td></tr>`).join("")}</table></div></div>`;
}
function renderSettings(){$("main").innerHTML=`<div class="title"><h1>Pengaturan</h1></div><div class="panel"><h3>Akun Admin</h3><p class="muted">Login: ${esc(user?.email)}</p><p class="muted">Database tersimpan online di Supabase dan dibatasi per akun admin.</p></div><div class="panel"><h3>Informasi</h3><p>HAFIEZHA24 • Toko Makanan</p><p>WhatsApp: 082227341970</p></div>`}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
$("switchMode").onclick=()=>{authSignup=!authSignup;$("authBtn").textContent=authSignup?"Daftar":"Masuk";$("switchText").textContent=authSignup?"Sudah punya akun?":"Belum punya akun?";$("switchMode").textContent=authSignup?"Masuk":"Daftar admin"};
$("authForm").onsubmit=async e=>{e.preventDefault();$("authBtn").disabled=true;const email=$("email").value.trim(),password=$("password").value;
 let r=authSignup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 $("authBtn").disabled=false;if(r.error)return msg(r.error.message,true);
 if(authSignup){msg("Pendaftaran berhasil. Jika email confirmation aktif, buka email untuk konfirmasi lalu masuk.");return}
 user=r.data.user;await startApp();
};
$("logout").onclick=async()=>{await sb.auth.signOut();user=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden")};

async function startApp(){if(!user)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=user.email;await loadAll();render()}
sb.auth.getSession().then(async({data})=>{user=data.session?.user||null;if(user)startApp()});
sb.auth.onAuthStateChange(async(_e,s)=>{if(s?.user&&!user){user=s.user;startApp()}});
</script>
</body>
</html>
